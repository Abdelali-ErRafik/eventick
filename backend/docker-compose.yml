services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: eventick
    ports:
      - "5432:5432"
    volumes:
      - eventick_db_data:/var/lib/postgresql/data

volumes:
  eventick_db_data:
